<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZERO zlib64 Decoder</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@10"></script>
    <style>
        /* 🌙  ZERO zlib64 Theme */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 450px;
            background: rgba(22, 27, 34, 0.9);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            border: 2px solid rgba(0, 255, 204, 0.5);
            backdrop-filter: blur(10px);
            transition: 0.3s;
        }

        .container:hover {
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.6);
        }

        h1 {
            color: #00ffcc;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.8);
            font-size: 24px;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: rgba(31, 41, 55, 0.8);
            color: #00ffcc;
            border: 2px solid #00ffcc;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            resize: none;
            outline: none;
            transition: 0.3s;
        }

        textarea:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        button {
            background: linear-gradient(45deg, #00ffcc, #009999);
            color: #121212;
            padding: 12px 20px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            transition: 0.3s ease-in-out;
            box-shadow: 0 4px 10px rgba(0, 255, 204, 0.4);
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300%;
            height: 300%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 10%, transparent 10.01%);
            transition: 0.4s ease-out;
            transform: translate(-50%, -50%) scale(0);
        }

        button:hover::before {
            transform: translate(-50%, -50%) scale(1);
        }

        button:hover {
            background: linear-gradient(45deg, #009999, #00ffcc);
            box-shadow: 0 6px 15px rgba(0, 255, 204, 0.6);
        }

        .output-container {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            background: rgba(31, 41, 55, 0.8);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
            border: 2px solid #00ffcc;
            text-align: left;
        }

        pre {
            color: #ffffff;
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        footer {
            margin-top: 15px;
            font-size: 14px;
            color: #aaaaaa;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔌💩 ZERO zlib64 Decoder</h1><br>
        <textarea id="encodedText" placeholder="Enter encoded text..."></textarea>
        <button onclick="decodeBase64()">🔎 Decode</button>

        <div class="output-container">
            <h5>🇧🇩🥳 Decoded Output:</h5>
            <pre id="outputText"></pre>
        </div>
    </div>

    

    <script>
        function decodeBase64() {
            var inputBase64 = document.getElementById("encodedText").value.trim();

            try {
                var decoded = decodeURIComponent(escape(atob(inputBase64)));
                document.getElementById("outputText").textContent = decoded;

            } catch (e) {
                Swal.fire("❌ Error!", "Invalid string!", "error");
            }
        }
    </script>

</body>
</html>
